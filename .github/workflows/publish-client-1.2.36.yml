name: Publish verified TikTeam 1.2.36 Windows release

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-client-1.2.36.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikteam-client-release-1.2.36
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'etologin/Tikteam-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: etologin/Tikteam-site
      RELEASE_TAG: client-v1.2.36
    steps:
      - name: Require successful independent Defender scan for the pinned client
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/etologin/Tikteam-site/actions/runs/43067400835 > defender-run.json
          jq -e '.conclusion == "success" and .head_sha == "dc4f82fc152223b0ee6ad0475f5b26c1f8a1a7e8" and .path == ".github/workflows/verify-client-1.2.36.yml"' defender-run.json > /dev/null

      - name: Download and verify exact published installer, signed metadata and client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 300 --retry 2 --output TikTeam.Setup.exe https://updates.tikteam.live/TikTeam.Setup.exe
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 30 --retry 2 --output release.json https://updates.tikteam.live/v1/subscriber/windows-x64/latest
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 600 --retry 2 --output client-179158c9f94afe23e96bb2861dd491419a1adc1bd96880b1f241b06be42f17b2.zip https://updates.tikteam.live/packages/179158c9f94afe23e96bb2861dd491419a1adc1bd96880b1f241b06be42f17b2.zip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162877793
          test "$(stat -c %s client-179158c9f94afe23e96bb2861dd491419a1adc1bd96880b1f241b06be42f17b2.zip)" = 732189013
          printf '%s  %s\n' d8244f7dc5e6789664c3b5941bfffb6d698bfc2bdd72e4f79e9163ac8a6c70d0 TikTeam.Setup.exe 0a95638a1812777ff128d1c239134e4be2c99f36c117f9fb30f170fc9820f13a release.json 179158c9f94afe23e96bb2861dd491419a1adc1bd96880b1f241b06be42f17b2 client-179158c9f94afe23e96bb2861dd491419a1adc1bd96880b1f241b06be42f17b2.zip | sha256sum --check --strict

      - name: Publish release assets and verify mirror roundtrip
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          TikTeam 1.2.36 for Windows 10/11 (64-bit).

          Подключение Kaspi на iPhone через QR-код и веб-кабинет.
          Добавлены форма сообщения об ошибке и исправления галереи виджетов.
          Для обновления с 1.2.35 доступен пакет изменений 44 МБ.

          Installer: 162877793 bytes.
          SHA256: d8244f7dc5e6789664c3b5941bfffb6d698bfc2bdd72e4f79e9163ac8a6c70d0
          Client archive SHA256: 179158c9f94afe23e96bb2861dd491419a1adc1bd96880b1f241b06be42f17b2
          Client source: f577d2a28cb012693442b8290808547758945219
          NOTES
          if ! gh release view "$RELEASE_TAG" --json tagName > /dev/null; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --latest=false --title 'TikTeam 1.2.36 — Windows' --notes-file release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json assets,isDraft > release-state.json
          for asset in TikTeam.Setup.exe release.json client-179158c9f94afe23e96bb2861dd491419a1adc1bd96880b1f241b06be42f17b2.zip; do
            if ! jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' release-state.json > /dev/null; then
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          mkdir verified-roundtrip
          gh release download "$RELEASE_TAG" --dir verified-roundtrip
          cd verified-roundtrip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162877793
          test "$(stat -c %s client-179158c9f94afe23e96bb2861dd491419a1adc1bd96880b1f241b06be42f17b2.zip)" = 732189013
          printf '%s  %s\n' d8244f7dc5e6789664c3b5941bfffb6d698bfc2bdd72e4f79e9163ac8a6c70d0 TikTeam.Setup.exe 0a95638a1812777ff128d1c239134e4be2c99f36c117f9fb30f170fc9820f13a release.json 179158c9f94afe23e96bb2861dd491419a1adc1bd96880b1f241b06be42f17b2 client-179158c9f94afe23e96bb2861dd491419a1adc1bd96880b1f241b06be42f17b2.zip | sha256sum --check --strict
          cd ..
          if jq -e '.isDraft' release-state.json > /dev/null; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
          fi
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
