name: Independently verify TikTeam 1.2.26 for Windows

on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-client-1.2.26.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikteam-defender-client-1.2.26
  cancel-in-progress: false

jobs:
  defender:
    if: github.repository == 'etologin/Tikteam-site' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Verify package and installer pins and scan without executing them
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $expected = 'A5337F6281772D63780974284B74200ADD9D9E43967EA863D9F2F166F28EE409'
          $setupHash = 'F9B56092A3FD0406257B38AC2FD0845981A3214C811332A9AA69E1A76BB9D66F'
          $status = Get-MpComputerStatus
          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) { throw 'Defender is unavailable' }
          Update-MpSignature
          $status = Get-MpComputerStatus
          $file = Join-Path $env:RUNNER_TEMP 'TikTeam-client-1.2.26.zip'
          Invoke-WebRequest -UseBasicParsing -MaximumRedirection 0 -Uri 'https://updates.tikteam.live/packages/a5337f6281772d63780974284b74200add9d9e43967ea863d9f2f166f28ee409.zip' -OutFile $file
          if ((Get-Item -LiteralPath $file).Length -ne 770239764 -or (Get-FileHash -LiteralPath $file).Hash -ne $expected) { throw 'Client pin mismatch' }
          $folder = Join-Path $env:RUNNER_TEMP 'TikTeam-client-1.2.26'
          Expand-Archive -LiteralPath $file -DestinationPath $folder
          $installer = Join-Path $folder 'TikTeam.Setup.exe'
          $count = (Get-ChildItem -LiteralPath $folder -File -Recurse).Count
          if ($count -ne 3363) { throw 'Extracted inventory mismatch' }
          if ((Get-Item -LiteralPath $installer).Length -ne 162862945 -or (Get-FileHash -LiteralPath $installer).Hash -ne $setupHash) { throw 'Installer pin mismatch' }
          $voice = Join-Path $env:RUNNER_TEMP 'TikTeam-Silero-Kazakh-win-x64.zip'
          $voiceHash = '239F933EE43BE17645A5F7B02266A448442FB045063BBAAFA1337D9E0E03613'
          Invoke-WebRequest -UseBasicParsing -MaximumRedirection 0 -Uri 'https://updates.tikteam.live/packages/239f933ee43be17645a5f7b02266a448442fb045063bbaafa1337d9e0e03613.zip' -OutFile $voice
          if ((Get-Item -LiteralPath $voice).Length -ne 201918482 -or (Get-FileHash -LiteralPath $voice).Hash -ne $voiceHash) { throw 'Voice pack pin mismatch' }
          Expand-Archive -LiteralPath $voice -DestinationPath (Join-Path $folder 'optional-voice-pack')
          $scanner = 'C:\ProgramData\Microsoft\Windows Defender\Platform\CurrentVersion\MpCmdRun.exe'
          if (-not (Test-Path -LiteralPath $scanner)) { $scanner = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe' }
          $output = & $scanner -Scan -ScanType 3 -File $folder -DisableRemediation 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $output
          if ($code -ne 0 -or $output -notmatch 'found no threats') { throw 'Defender did not return a clean scan' }
          if ((Get-FileHash -LiteralPath $file).Hash -ne $expected -or (Get-FileHash -LiteralPath $installer).Hash -ne $setupHash) { throw 'A pin changed during the scan' }
          $result = [ordered]@{Passed=$true;Sha256=$expected;SetupSha256=$setupHash;Bytes=770239764;ExtractedFiles=$count;VoicePackSha256=$voiceHash;SignatureVersion=$status.AntivirusSignatureVersion;CandidateExecuted=$false;ProtectionSettingsChanged=$false}
          Write-Output ('TIKTEAM_DEFENDER_RESULT=' + ($result | ConvertTo-Json -Compress))
