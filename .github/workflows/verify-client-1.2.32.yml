name: Independently verify TikTeam 1.2.32 for Windows

on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-client-1.2.32.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikteam-defender-client-1.2.32
  cancel-in-progress: false

jobs:
  defender:
    if: github.repository == 'etologin/Tikteam-site' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Verify package and installer pins and scan without executing them
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $expected = '1E114E8DFDE7E6F6FC1DE0500B06853C951D0F235C27B6A5E9218AD772943379'
          $setupHash = 'D68A78499962B9739AD9916184B07AFFE3F3C4EBB93C2FEB53911034DA7A6F92'
          $status = Get-MpComputerStatus
          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) { throw 'Defender is unavailable' }
          Update-MpSignature
          $status = Get-MpComputerStatus
          $file = Join-Path $env:RUNNER_TEMP 'TikTeam-client-1.2.32.zip'
          Invoke-WebRequest -UseBasicParsing -MaximumRedirection 0 -Uri 'https://updates.tikteam.live/packages/1e114e8dfde7e6f6fc1de0500b06853c951d0f235c27b6a5e9218ad772943379.zip' -OutFile $file
          if ((Get-Item -LiteralPath $file).Length -ne 721878937 -or (Get-FileHash -LiteralPath $file).Hash -ne $expected) { throw 'Client pin mismatch' }
          $folder = Join-Path $env:RUNNER_TEMP 'TikTeam-client-1.2.32'
          Expand-Archive -LiteralPath $file -DestinationPath $folder
          $installer = Join-Path $folder 'TikTeam.Setup.exe'
          $count = (Get-ChildItem -LiteralPath $folder -File -Recurse).Count
          if ($count -ne 3324) { throw 'Extracted inventory mismatch' }
          if ((Get-Item -LiteralPath $installer).Length -ne 162877281 -or (Get-FileHash -LiteralPath $installer).Hash -ne $setupHash) { throw 'Installer pin mismatch' }
          $scanner = 'C:\ProgramData\Microsoft\Windows Defender\Platform\CurrentVersion\MpCmdRun.exe'
          if (-not (Test-Path -LiteralPath $scanner)) { $scanner = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe' }
          $output = & $scanner -Scan -ScanType 3 -File $folder -DisableRemediation 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $output
          if ($code -ne 0 -or $output -notmatch 'found no threats') { throw 'Defender did not return a clean scan' }
          if ((Get-FileHash -LiteralPath $file).Hash -ne $expected -or (Get-FileHash -LiteralPath $installer).Hash -ne $setupHash) { throw 'A pin changed during the scan' }
          $result = [ordered]@{Passed=$true;Sha256=$expected;SetupSha256=$setupHash;Bytes=721878937;ExtractedFiles=$count;SignatureVersion=$status.AntivirusSignatureVersion;CandidateExecuted=$false;ProtectionSettingsChanged=$false}
          Write-Output ('TIKTEAM_DEFENDER_RESULT=' + ($result | ConvertTo-Json -Compress))
