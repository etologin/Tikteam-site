name: Independently verify TikTeam 1.2.46 for Windows

on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-client-1.2.46.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikteam-defender-client-1.2.46
  cancel-in-progress: false

jobs:
  defender:
    if: github.repository == 'etologin/Tikteam-site' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Verify package and installer pins and scan without executing them
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $expected = '92BF7382CD67DA5575D3E48827B57CE2CBF0FB3C85FA8FF2C335B0182F96C7F1'
          $setupHash = 'D2BA599BEF8C6B298CAD32B3124A64D881E7890396BAE29DE1D5932A51271478'
          $status = Get-MpComputerStatus
          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) { throw 'Defender is unavailable' }
          Update-MpSignature
          $status = Get-MpComputerStatus
          $file = Join-Path $env:RUNNER_TEMP 'TikTeam-client-1.2.46.zip'
          Invoke-WebRequest -UseBasicParsing -MaximumRedirection 0 -Uri 'https://updates.tikteam.live/packages/92bf7382cd67da5575d3e48827b57ce2cbf0fb3c85fa8ff2c335b0182f96c7f1.zip' -OutFile $file
          if ((Get-Item -LiteralPath $file).Length -ne 890100883 -or (Get-FileHash -LiteralPath $file).Hash -ne $expected) { throw 'Client pin mismatch' }
          $folder = Join-Path $env:RUNNER_TEMP 'TikTeam-client-1.2.46'
          Expand-Archive -LiteralPath $file -DestinationPath $folder
          $installer = Join-Path $folder 'TikTeam.Setup.exe'
          $count = (Get-ChildItem -LiteralPath $folder -File -Recurse).Count
          if ($count -ne 3416) { throw 'Extracted inventory mismatch' }
          if ((Get-Item -LiteralPath $installer).Length -ne 162890540 -or (Get-FileHash -LiteralPath $installer).Hash -ne $setupHash) { throw 'Installer pin mismatch' }
          $scanner = 'C:\ProgramData\Microsoft\Windows Defender\Platform\CurrentVersion\MpCmdRun.exe'
          if (-not (Test-Path -LiteralPath $scanner)) { $scanner = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe' }
          $output = & $scanner -Scan -ScanType 3 -File $folder -DisableRemediation 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $output
          if ($code -ne 0 -or $output -notmatch 'found no threats') { throw 'Defender did not return a clean scan' }
          if ((Get-FileHash -LiteralPath $file).Hash -ne $expected -or (Get-FileHash -LiteralPath $installer).Hash -ne $setupHash) { throw 'A pin changed during the scan' }
          $result = [ordered]@{Passed=$true;Sha256=$expected;SetupSha256=$setupHash;Bytes=890100883;ExtractedFiles=$count;SignatureVersion=$status.AntivirusSignatureVersion;CandidateExecuted=$false;ProtectionSettingsChanged=$false}
          $proof = $result | ConvertTo-Json -Compress
          Write-Output ('TIKTEAM_DEFENDER_RESULT=' + $proof)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ('Defender verified the pinned TikTeam package and installer. ' + $proof)
