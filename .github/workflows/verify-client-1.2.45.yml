name: Independently verify TikTeam 1.2.45 for Windows

on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-client-1.2.45.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikteam-defender-client-1.2.45
  cancel-in-progress: false

jobs:
  defender:
    if: github.repository == 'etologin/Tikteam-site' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Verify package and installer pins and scan without executing them
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $expected = '5903A2E2DEBF64FB74116696B63EB0307EACFB1798898822A44B6545C95EE7AA'
          $setupHash = '568E6EFBF1F70AB64BF8EFBD51F73A4D913D7574CE35A1CE5DB9E11DEC34B018'
          $status = Get-MpComputerStatus
          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) { throw 'Defender is unavailable' }
          Update-MpSignature
          $status = Get-MpComputerStatus
          $file = Join-Path $env:RUNNER_TEMP 'TikTeam-client-1.2.45.zip'
          Invoke-WebRequest -UseBasicParsing -MaximumRedirection 0 -Uri 'https://updates.tikteam.live/packages/5903a2e2debf64fb74116696b63eb0307eacfb1798898822a44b6545c95ee7aa.zip' -OutFile $file
          if ((Get-Item -LiteralPath $file).Length -ne 728013636 -or (Get-FileHash -LiteralPath $file).Hash -ne $expected) { throw 'Client pin mismatch' }
          $folder = Join-Path $env:RUNNER_TEMP 'TikTeam-client-1.2.45'
          Expand-Archive -LiteralPath $file -DestinationPath $folder
          $installer = Join-Path $folder 'TikTeam.Setup.exe'
          $count = (Get-ChildItem -LiteralPath $folder -File -Recurse).Count
          if ($count -ne 3371) { throw 'Extracted inventory mismatch' }
          if ((Get-Item -LiteralPath $installer).Length -ne 162887468 -or (Get-FileHash -LiteralPath $installer).Hash -ne $setupHash) { throw 'Installer pin mismatch' }
          $scanner = 'C:\ProgramData\Microsoft\Windows Defender\Platform\CurrentVersion\MpCmdRun.exe'
          if (-not (Test-Path -LiteralPath $scanner)) { $scanner = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe' }
          $output = & $scanner -Scan -ScanType 3 -File $folder -DisableRemediation 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $output
          if ($code -ne 0 -or $output -notmatch 'found no threats') { throw 'Defender did not return a clean scan' }
          if ((Get-FileHash -LiteralPath $file).Hash -ne $expected -or (Get-FileHash -LiteralPath $installer).Hash -ne $setupHash) { throw 'A pin changed during the scan' }
          $result = [ordered]@{Passed=$true;Sha256=$expected;SetupSha256=$setupHash;Bytes=728013636;ExtractedFiles=$count;SignatureVersion=$status.AntivirusSignatureVersion;CandidateExecuted=$false;ProtectionSettingsChanged=$false}
          $proof = $result | ConvertTo-Json -Compress
          Write-Output ('TIKTEAM_DEFENDER_RESULT=' + $proof)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ('Defender verified the pinned TikTeam package and installer. ' + $proof)
