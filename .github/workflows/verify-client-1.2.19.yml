name: Independently verify TikTeam client 1.2.19

on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-client-1.2.19.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikteam-defender-client-1.2.19
  cancel-in-progress: false

jobs:
  defender:
    if: github.repository == 'etologin/Tikteam-site' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Scan exact client without executing it or changing protection
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $expected = 'A1B4970F93CF7D04032A5ABE5AC59C427147438D9A5BD3FC0DE6F0AA0E74FE4F'
          $status = Get-MpComputerStatus
          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) { throw 'Defender is unavailable' }
          Update-MpSignature
          $status = Get-MpComputerStatus
          $file = Join-Path $env:RUNNER_TEMP 'TikTeam-client-1.2.19.zip'
          Invoke-WebRequest -UseBasicParsing -MaximumRedirection 0 -Uri 'https://updates.tikteam.live/packages/a1b4970f93cf7d04032a5abe5ac59c427147438d9a5bd3fc0de6f0aa0e74fe4f.zip' -OutFile $file
          if ((Get-Item -LiteralPath $file).Length -ne 874173865 -or (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $expected) { throw 'Client pin mismatch' }
          $folder = Join-Path $env:RUNNER_TEMP 'TikTeam-client-1.2.19'
          Expand-Archive -LiteralPath $file -DestinationPath $folder
          $scanner = 'C:\ProgramData\Microsoft\Windows Defender\Platform\CurrentVersion\MpCmdRun.exe'
          if (-not (Test-Path -LiteralPath $scanner)) { $scanner = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe' }
          $output = & $scanner -Scan -ScanType 3 -File $folder -DisableRemediation 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $output
          if ($code -ne 0 -or $output -notmatch 'found no threats') { throw 'Defender did not return a clean scan' }
          if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $expected) { throw 'Client changed during scan' }
          $result = [ordered]@{ Passed=$true; Sha256=$expected; Bytes=874173865; AntivirusEnabled=$status.AntivirusEnabled; RealTimeProtectionEnabled=$status.RealTimeProtectionEnabled; SignatureVersion=$status.AntivirusSignatureVersion; EngineVersion=$status.AMEngineVersion; CandidateExecuted=$false; ProtectionSettingsChanged=$false; ExtractedFiles=(Get-ChildItem -LiteralPath $folder -File -Recurse).Count }
          Write-Output ('TIKTEAM_DEFENDER_RESULT=' + ($result | ConvertTo-Json -Compress))