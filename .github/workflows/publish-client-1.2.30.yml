name: Publish verified TikTeam 1.2.30 Windows release

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-client-1.2.30.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikteam-client-release-1.2.30
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'etologin/Tikteam-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: etologin/Tikteam-site
      RELEASE_TAG: client-v1.2.30
    steps:
      - name: Require successful independent Defender scan for the pinned client
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/etologin/Tikteam-site/actions/runs/42500862570 > defender-run.json
          jq -e '.conclusion == "success" and .head_sha == "8eb8f3e5dea5786c39c0c6f95ecedfc6f17fca90" and .path == ".github/workflows/verify-client-1.2.30.yml"' defender-run.json > /dev/null

      - name: Download and verify exact published installer, signed metadata and client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 300 --retry 2 --output TikTeam.Setup.exe https://updates.tikteam.live/TikTeam.Setup.exe
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 30 --retry 2 --output release.json https://updates.tikteam.live/v1/subscriber/windows-x64/latest
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 600 --retry 2 --output client-52723b65d671fc6e770db7b93eaaeac4d9e88de68c0c2d15dab6835dc25367d2.zip https://updates.tikteam.live/packages/52723b65d671fc6e770db7b93eaaeac4d9e88de68c0c2d15dab6835dc25367d2.zip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162876769
          test "$(stat -c %s client-52723b65d671fc6e770db7b93eaaeac4d9e88de68c0c2d15dab6835dc25367d2.zip)" = 721874108
          printf '%s  %s\n' 36571014f6bd9a331cc3d6928665073545b8e0d22ef4e6e3f61a4b6f8a181871 TikTeam.Setup.exe 5e6dbecf790909d2a9404c811d240df1eff29b8ae5f78cfad2e010ea8e516c8a release.json 52723b65d671fc6e770db7b93eaaeac4d9e88de68c0c2d15dab6835dc25367d2 client-52723b65d671fc6e770db7b93eaaeac4d9e88de68c0c2d15dab6835dc25367d2.zip | sha256sum --check --strict

      - name: Publish release assets and verify mirror roundtrip
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          TikTeam 1.2.30 for Windows 10/11 (64-bit).

          TikTeam автоматически устанавливает доступное обновление при запуске.
          Для поддерживаемых версий установщик скачивает только изменённые файлы и проверяет результат по подписанному манифесту.
          Исправлен перехват кликов служебными окнами виджетов.
          Проверены установка, обновление с сохранением настроек и откат. Defender проверил файлы локально и на независимом Windows.

          Installer: 162876769 bytes.
          SHA256: 36571014f6bd9a331cc3d6928665073545b8e0d22ef4e6e3f61a4b6f8a181871
          Client archive SHA256: 52723b65d671fc6e770db7b93eaaeac4d9e88de68c0c2d15dab6835dc25367d2
          Client source: d2d4e45fefb9636c6117fb07cbc4e86506861e7b
          NOTES
          if ! gh release view "$RELEASE_TAG" --json tagName > /dev/null; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --latest=false --title 'TikTeam 1.2.30 — Windows' --notes-file release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json assets,isDraft > release-state.json
          for asset in TikTeam.Setup.exe release.json client-52723b65d671fc6e770db7b93eaaeac4d9e88de68c0c2d15dab6835dc25367d2.zip; do
            if ! jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' release-state.json > /dev/null; then
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          mkdir verified-roundtrip
          gh release download "$RELEASE_TAG" --dir verified-roundtrip
          cd verified-roundtrip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162876769
          test "$(stat -c %s client-52723b65d671fc6e770db7b93eaaeac4d9e88de68c0c2d15dab6835dc25367d2.zip)" = 721874108
          printf '%s  %s\n' 36571014f6bd9a331cc3d6928665073545b8e0d22ef4e6e3f61a4b6f8a181871 TikTeam.Setup.exe 5e6dbecf790909d2a9404c811d240df1eff29b8ae5f78cfad2e010ea8e516c8a release.json 52723b65d671fc6e770db7b93eaaeac4d9e88de68c0c2d15dab6835dc25367d2 client-52723b65d671fc6e770db7b93eaaeac4d9e88de68c0c2d15dab6835dc25367d2.zip | sha256sum --check --strict
          cd ..
          if jq -e '.isDraft' release-state.json > /dev/null; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
          fi
