name: Publish verified TikTeam 1.2.42 Windows release

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-client-1.2.42.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikteam-client-release-1.2.42
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'etologin/Tikteam-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: etologin/Tikteam-site
      RELEASE_TAG: client-v1.2.42
    steps:
      - name: Require successful independent Defender scan for the pinned client
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/etologin/Tikteam-site/actions/runs/43931321479 > defender-run.json
          jq -e '.conclusion == "success" and .head_sha == "2b248df7c1c31fc77553d2f3f9f88e43519f64cc" and .path == ".github/workflows/verify-client-1.2.42.yml"' defender-run.json > /dev/null

      - name: Download and verify exact published installer, signed metadata and client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 300 --retry 2 --output TikTeam.Setup.exe https://updates.tikteam.live/TikTeam.Setup.exe
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 30 --retry 2 --output release.json https://updates.tikteam.live/v1/subscriber/windows-x64/latest
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 600 --retry 2 --output client-afdeaab8a9a216ee6a1ee480d7a0ea1d8d84b8b1e4dbc311d86d568ad95cf2f4.zip https://updates.tikteam.live/packages/afdeaab8a9a216ee6a1ee480d7a0ea1d8d84b8b1e4dbc311d86d568ad95cf2f4.zip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162877793
          test "$(stat -c %s client-afdeaab8a9a216ee6a1ee480d7a0ea1d8d84b8b1e4dbc311d86d568ad95cf2f4.zip)" = 725690460
          printf '%s  %s\n' d8244f7dc5e6789664c3b5941bfffb6d698bfc2bdd72e4f79e9163ac8a6c70d0 TikTeam.Setup.exe 034fee551ae0e1ffcf23be9af54ce4db79af17ea94b2a80b927a1edf6f3785d3 release.json afdeaab8a9a216ee6a1ee480d7a0ea1d8d84b8b1e4dbc311d86d568ad95cf2f4 client-afdeaab8a9a216ee6a1ee480d7a0ea1d8d84b8b1e4dbc311d86d568ad95cf2f4.zip | sha256sum --check --strict

      - name: Publish release assets and verify mirror roundtrip
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          TikTeam 1.2.42 for Windows 10/11 (64-bit).

          TikDonate принимает Kaspi, Freedom и Halyk от Android-приложения, подключённого к тому же аккаунту.
          Обновлён мод Streets of Rage 4. TikTeam показывает статус эфира, отключается при его завершении и сохраняет настройку автоподключения. Обновление с 1.2.42 загружает 18 изменённых файлов (30.9 МБ).
          Включены плавная прокрутка галереи, сохранение окна захвата LIVE Studio, диагностика задержек и закрытие захвата без блокировки вывода.
          Android 0.3.10: https://updates.tikteam.live/android/TikTeam-Android-0.3.10.apk

          Installer: 162877793 bytes.
          SHA256: d8244f7dc5e6789664c3b5941bfffb6d698bfc2bdd72e4f79e9163ac8a6c70d0
          Client archive SHA256: afdeaab8a9a216ee6a1ee480d7a0ea1d8d84b8b1e4dbc311d86d568ad95cf2f4
          Client source: 84aee306a50379cad27e32bc5a3e95b4dbb519b7
          NOTES
          if ! gh release view "$RELEASE_TAG" --json tagName > /dev/null; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --latest=false --title 'TikTeam 1.2.42 — Windows' --notes-file release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json assets,isDraft > release-state.json
          for asset in TikTeam.Setup.exe release.json client-afdeaab8a9a216ee6a1ee480d7a0ea1d8d84b8b1e4dbc311d86d568ad95cf2f4.zip; do
            if ! jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' release-state.json > /dev/null; then
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          mkdir verified-roundtrip
          gh release download "$RELEASE_TAG" --dir verified-roundtrip
          cd verified-roundtrip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162877793
          test "$(stat -c %s client-afdeaab8a9a216ee6a1ee480d7a0ea1d8d84b8b1e4dbc311d86d568ad95cf2f4.zip)" = 725690460
          printf '%s  %s\n' d8244f7dc5e6789664c3b5941bfffb6d698bfc2bdd72e4f79e9163ac8a6c70d0 TikTeam.Setup.exe 034fee551ae0e1ffcf23be9af54ce4db79af17ea94b2a80b927a1edf6f3785d3 release.json afdeaab8a9a216ee6a1ee480d7a0ea1d8d84b8b1e4dbc311d86d568ad95cf2f4 client-afdeaab8a9a216ee6a1ee480d7a0ea1d8d84b8b1e4dbc311d86d568ad95cf2f4.zip | sha256sum --check --strict
          cd ..
          if jq -e '.isDraft' release-state.json > /dev/null; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
          fi
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
