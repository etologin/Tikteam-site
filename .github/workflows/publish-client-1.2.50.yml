name: Publish verified TikTeam 1.2.50 Windows release

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-client-1.2.50.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikteam-client-release-1.2.50
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'etologin/Tikteam-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: etologin/Tikteam-site
      RELEASE_TAG: client-v1.2.50
    steps:
      - name: Require successful independent Defender scan for the pinned client
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/etologin/Tikteam-site/actions/runs/46148223241 > defender-run.json
          jq -e '.conclusion == "success" and .head_sha == "0ebf27f34b238105fd845d2ea2423ed33da8566c" and .path == ".github/workflows/verify-client-1.2.50.yml"' defender-run.json > /dev/null

      - name: Download and verify exact published installer, signed metadata and client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 300 --retry 2 --output TikTeam.Setup.exe https://updates.tikteam.live/TikTeam.Setup.exe
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 30 --retry 2 --output release.json https://updates.tikteam.live/v1/subscriber/windows-x64/latest
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 600 --retry 2 --output client-ea02332d0c9869d2e21e09ad9bd904491d450d56cf7f227f3b0e759229969929.zip https://updates.tikteam.live/packages/ea02332d0c9869d2e21e09ad9bd904491d450d56cf7f227f3b0e759229969929.zip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162898732
          test "$(stat -c %s client-ea02332d0c9869d2e21e09ad9bd904491d450d56cf7f227f3b0e759229969929.zip)" = 890955680
          printf '%s  %s\n' ef95b9bacd78bd600cd76c3249980031bbdf9ec4b70795ef2645aed8ed7276cb TikTeam.Setup.exe 28dcef92b0947035118391d0e8ceeaf8b6e4bfa6b830302b3c9165bef9b3289f release.json ea02332d0c9869d2e21e09ad9bd904491d450d56cf7f227f3b0e759229969929 client-ea02332d0c9869d2e21e09ad9bd904491d450d56cf7f227f3b0e759229969929.zip | sha256sum --check --strict

      - name: Publish release assets and verify mirror roundtrip
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          TikTeam 1.2.50 for Windows 10/11 (64-bit).

          Оптимизированы окно захвата, таймер, Top Gift, Топ комбо, рейтинги и пушка подарков. Подписка, пробный период и скидки за комплект собраны наверху главной. Усилена защита клиентской сборки.
          Обновление с 1.2.49 содержит 15 изменённых или новых файлов (118.1 МБ).
          Android 0.3.11: https://updates.tikteam.live/android/TikTeam-Android-0.3.11.apk

          Installer: 162898732 bytes.
          SHA256: ef95b9bacd78bd600cd76c3249980031bbdf9ec4b70795ef2645aed8ed7276cb
          Client archive SHA256: ea02332d0c9869d2e21e09ad9bd904491d450d56cf7f227f3b0e759229969929
          Client source: dea3623df1200acb23a27ce82a525c92f06ac61c
          NOTES
          if ! gh release view "$RELEASE_TAG" --json tagName > /dev/null; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --latest=false --title 'TikTeam 1.2.50 — Windows' --notes-file release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json assets,isDraft > release-state.json
          for asset in TikTeam.Setup.exe release.json client-ea02332d0c9869d2e21e09ad9bd904491d450d56cf7f227f3b0e759229969929.zip; do
            if ! jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' release-state.json > /dev/null; then
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          mkdir verified-roundtrip
          gh release download "$RELEASE_TAG" --dir verified-roundtrip
          cd verified-roundtrip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162898732
          test "$(stat -c %s client-ea02332d0c9869d2e21e09ad9bd904491d450d56cf7f227f3b0e759229969929.zip)" = 890955680
          printf '%s  %s\n' ef95b9bacd78bd600cd76c3249980031bbdf9ec4b70795ef2645aed8ed7276cb TikTeam.Setup.exe 28dcef92b0947035118391d0e8ceeaf8b6e4bfa6b830302b3c9165bef9b3289f release.json ea02332d0c9869d2e21e09ad9bd904491d450d56cf7f227f3b0e759229969929 client-ea02332d0c9869d2e21e09ad9bd904491d450d56cf7f227f3b0e759229969929.zip | sha256sum --check --strict
          cd ..
          if jq -e '.isDraft' release-state.json > /dev/null; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
          fi
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
