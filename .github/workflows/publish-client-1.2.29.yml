name: Publish verified TikTeam 1.2.29 Windows release

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-client-1.2.29.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikteam-client-release-1.2.29
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'etologin/Tikteam-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: etologin/Tikteam-site
      RELEASE_TAG: client-v1.2.29
    steps:
      - name: Require successful independent Defender scan for the pinned client
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/etologin/Tikteam-site/actions/runs/42496066564 > defender-run.json
          jq -e '.conclusion == "success" and .head_sha == "b82eb86af594918cb72549845f163a5bc9a120dc" and .path == ".github/workflows/verify-client-1.2.29.yml"' defender-run.json > /dev/null

      - name: Download and verify exact published installer, signed metadata and client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 300 --retry 2 --output TikTeam.Setup.exe https://updates.tikteam.live/TikTeam.Setup.exe
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 30 --retry 2 --output release.json https://updates.tikteam.live/v1/subscriber/windows-x64/latest
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 600 --retry 2 --output client-977e7c1a85f2dfbe7563be6f3b1f931ab6e6ad8b4cdc6348543824b67a82b4c2.zip https://updates.tikteam.live/packages/977e7c1a85f2dfbe7563be6f3b1f931ab6e6ad8b4cdc6348543824b67a82b4c2.zip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162862945
          test "$(stat -c %s client-977e7c1a85f2dfbe7563be6f3b1f931ab6e6ad8b4cdc6348543824b67a82b4c2.zip)" = 721863207
          printf '%s  %s\n' f9b56092a3fd0406257b38ac2fd0845981a3214c811332a9aa69e1a76bb9d66f TikTeam.Setup.exe 6aafe824e3a49b4aaa118f5fb463ad4ab4b9d40d19b18750b18e96fc24846c4f release.json 977e7c1a85f2dfbe7563be6f3b1f931ab6e6ad8b4cdc6348543824b67a82b4c2 client-977e7c1a85f2dfbe7563be6f3b1f931ab6e6ad8b4cdc6348543824b67a82b4c2.zip | sha256sum --check --strict

      - name: Publish release assets and verify mirror roundtrip
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          TikTeam 1.2.29 for Windows 10/11 (64-bit).

          Сцены сохраняются в аккаунте автоматически. При переключении работает только выбранная сцена.
          В редакторе всегда видны плитки добавления источников. Для переключения сцен доступны горячие клавиши и плавный переход.
          TikDonate принимает суммы в выбранной валюте. Приветствие отражается на выбранную сторону без отдельного масштаба.
          Проверены восстановление сцен, обновление с предыдущей версии, сохранение настроек и откат.
          Пакет проверен локальным и независимым Windows Defender.

          Installer: 162862945 bytes.
          SHA256: f9b56092a3fd0406257b38ac2fd0845981a3214c811332a9aa69e1a76bb9d66f
          Client archive SHA256: 977e7c1a85f2dfbe7563be6f3b1f931ab6e6ad8b4cdc6348543824b67a82b4c2
          Client source: 62925e29623e884c9b589ec77c6426c3b74f1ce1
          NOTES
          if ! gh release view "$RELEASE_TAG" --json tagName > /dev/null; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --latest=false --title 'TikTeam 1.2.29 — Windows' --notes-file release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json assets,isDraft > release-state.json
          for asset in TikTeam.Setup.exe release.json client-977e7c1a85f2dfbe7563be6f3b1f931ab6e6ad8b4cdc6348543824b67a82b4c2.zip; do
            if ! jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' release-state.json > /dev/null; then
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          mkdir verified-roundtrip
          gh release download "$RELEASE_TAG" --dir verified-roundtrip
          cd verified-roundtrip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162862945
          test "$(stat -c %s client-977e7c1a85f2dfbe7563be6f3b1f931ab6e6ad8b4cdc6348543824b67a82b4c2.zip)" = 721863207
          printf '%s  %s\n' f9b56092a3fd0406257b38ac2fd0845981a3214c811332a9aa69e1a76bb9d66f TikTeam.Setup.exe 6aafe824e3a49b4aaa118f5fb463ad4ab4b9d40d19b18750b18e96fc24846c4f release.json 977e7c1a85f2dfbe7563be6f3b1f931ab6e6ad8b4cdc6348543824b67a82b4c2 client-977e7c1a85f2dfbe7563be6f3b1f931ab6e6ad8b4cdc6348543824b67a82b4c2.zip | sha256sum --check --strict
          cd ..
          if jq -e '.isDraft' release-state.json > /dev/null; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
          fi
