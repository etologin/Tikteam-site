name: Publish verified TikTeam 1.2.26 Windows release

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-client-1.2.26.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikteam-client-release-1.2.26
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'etologin/Tikteam-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: etologin/Tikteam-site
      RELEASE_TAG: client-v1.2.26
    steps:
      - name: Require successful independent Defender scan for the pinned client
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/etologin/Tikteam-site/actions/runs/42239899116 > defender-run.json
          jq -e '.conclusion == "success" and .head_sha == "aa8212b00d2990d6d8c9322f85293f54b1b54151" and .path == ".github/workflows/verify-client-1.2.26.yml"' defender-run.json > /dev/null

      - name: Download and verify exact published installer, signed metadata and client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 300 --retry 2 --output TikTeam.Setup.exe https://updates.tikteam.live/TikTeam.Setup.exe
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 30 --retry 2 --output release.json https://updates.tikteam.live/v1/subscriber/windows-x64/latest
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 600 --retry 2 --output client-a5337f6281772d63780974284b74200add9d9e43967ea863d9f2f166f28ee409.zip https://updates.tikteam.live/packages/a5337f6281772d63780974284b74200add9d9e43967ea863d9f2f166f28ee409.zip
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 300 --retry 2 --output TikTeam-Silero-Kazakh-win-x64.zip https://updates.tikteam.live/packages/239f933ee43be17645a5f7b02266a448442fb045063bbaaafa1337d9e0e03613.zip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162862945
          test "$(stat -c %s client-a5337f6281772d63780974284b74200add9d9e43967ea863d9f2f166f28ee409.zip)" = 770239764
          printf '%s  %s\n' f9b56092a3fd0406257b38ac2fd0845981a3214c811332a9aa69e1a76bb9d66f TikTeam.Setup.exe c704f210549bdbfd512693480d419ccbd265877a558e2701aa99115ee193f1d7 release.json a5337f6281772d63780974284b74200add9d9e43967ea863d9f2f166f28ee409 client-a5337f6281772d63780974284b74200add9d9e43967ea863d9f2f166f28ee409.zip 239f933ee43be17645a5f7b02266a448442fb045063bbaaafa1337d9e0e03613 TikTeam-Silero-Kazakh-win-x64.zip | sha256sum --check --strict

      - name: Publish release assets and verify mirror roundtrip
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          TikTeam 1.2.26 for Windows 10/11 (64-bit).

          Локальная озвучка TikTok LIVE с выбором языка и голоса в разделе «Интерактив → TTS».
          Казахские голоса Жадыра и Жазира доступны отдельным ZIP-пакетом.
          Исправлена прокрутка TikDonate. Виджеты обновляют состояние при завершении эфира.

          Проверено обновление с 1.2.25, сохранение настроек и откат.
          Пакет и установщик проверены локальным и независимым Windows Defender.

          Installer: 162862945 bytes.
          SHA256: f9b56092a3fd0406257b38ac2fd0845981a3214c811332a9aa69e1a76bb9d66f
          Client archive SHA256: a5337f6281772d63780974284b74200add9d9e43967ea863d9f2f166f28ee409
          Client source: 396863260095572ad10103abe4dd0b2553889903
          NOTES
          if ! gh release view "$RELEASE_TAG" --json tagName > /dev/null; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --latest=false --title 'TikTeam 1.2.26 — Windows' --notes-file release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json assets,isDraft > release-state.json
          for asset in TikTeam.Setup.exe release.json client-a5337f6281772d63780974284b74200add9d9e43967ea863d9f2f166f28ee409.zip TikTeam-Silero-Kazakh-win-x64.zip; do
            if ! jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' release-state.json > /dev/null; then
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          mkdir verified-roundtrip
          gh release download "$RELEASE_TAG" --dir verified-roundtrip
          cd verified-roundtrip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162862945
          test "$(stat -c %s client-a5337f6281772d63780974284b74200add9d9e43967ea863d9f2f166f28ee409.zip)" = 770239764
          printf '%s  %s\n' f9b56092a3fd0406257b38ac2fd0845981a3214c811332a9aa69e1a76bb9d66f TikTeam.Setup.exe c704f210549bdbfd512693480d419ccbd265877a558e2701aa99115ee193f1d7 release.json a5337f6281772d63780974284b74200add9d9e43967ea863d9f2f166f28ee409 client-a5337f6281772d63780974284b74200add9d9e43967ea863d9f2f166f28ee409.zip 239f933ee43be17645a5f7b02266a448442fb045063bbaaafa1337d9e0e03613 TikTeam-Silero-Kazakh-win-x64.zip | sha256sum --check --strict
          cd ..
          if jq -e '.isDraft' release-state.json > /dev/null; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
          fi
