name: Publish verified TikTeam 1.2.32 Windows release

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-client-1.2.32.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikteam-client-release-1.2.32
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'etologin/Tikteam-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: etologin/Tikteam-site
      RELEASE_TAG: client-v1.2.32
    steps:
      - name: Require successful independent Defender scan for the pinned client
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/etologin/Tikteam-site/actions/runs/42510041357 > defender-run.json
          jq -e '.conclusion == "success" and .head_sha == "1665cdbc1443fcb255fe144c4fa7d3f5b38a19ce" and .path == ".github/workflows/verify-client-1.2.32.yml"' defender-run.json > /dev/null

      - name: Download and verify exact published installer, signed metadata and client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 300 --retry 2 --output TikTeam.Setup.exe https://updates.tikteam.live/TikTeam.Setup.exe
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 30 --retry 2 --output release.json https://updates.tikteam.live/v1/subscriber/windows-x64/latest
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 600 --retry 2 --output client-1e114e8dfde7e6f6fc1de0500b06853c951d0f235c27b6a5e9218ad772943379.zip https://updates.tikteam.live/packages/1e114e8dfde7e6f6fc1de0500b06853c951d0f235c27b6a5e9218ad772943379.zip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162877281
          test "$(stat -c %s client-1e114e8dfde7e6f6fc1de0500b06853c951d0f235c27b6a5e9218ad772943379.zip)" = 721878937
          printf '%s  %s\n' d68a78499962b9739ad9916184b07affe3f3c4ebb93c2feb53911034da7a6f92 TikTeam.Setup.exe 5312e0cc64d01f3b209ea43a10189045c706c26958ce4e73fbad2e4186af3459 release.json 1e114e8dfde7e6f6fc1de0500b06853c951d0f235c27b6a5e9218ad772943379 client-1e114e8dfde7e6f6fc1de0500b06853c951d0f235c27b6a5e9218ad772943379.zip | sha256sum --check --strict

      - name: Publish release assets and verify mirror roundtrip
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          TikTeam 1.2.32 for Windows 10/11 (64-bit).

          TikDonate возобновляет приём после восстановления подтверждённого доступа.
          Медиатека повторяет отправку блоков при кратком ограничении запросов.
          Встроенное обновление показывает отдельное окно прогресса и автоматически запускает TikTeam.
          Проверены сохранение настроек, откат и два сканирования Defender.

          Installer: 162877281 bytes.
          SHA256: d68a78499962b9739ad9916184b07affe3f3c4ebb93c2feb53911034da7a6f92
          Client archive SHA256: 1e114e8dfde7e6f6fc1de0500b06853c951d0f235c27b6a5e9218ad772943379
          Client source: c900214faf5448bb204a756b45d4a9ca0a8e6a25
          NOTES
          if ! gh release view "$RELEASE_TAG" --json tagName > /dev/null; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --latest=false --title 'TikTeam 1.2.32 — Windows' --notes-file release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json assets,isDraft > release-state.json
          for asset in TikTeam.Setup.exe release.json client-1e114e8dfde7e6f6fc1de0500b06853c951d0f235c27b6a5e9218ad772943379.zip; do
            if ! jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' release-state.json > /dev/null; then
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          mkdir verified-roundtrip
          gh release download "$RELEASE_TAG" --dir verified-roundtrip
          cd verified-roundtrip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162877281
          test "$(stat -c %s client-1e114e8dfde7e6f6fc1de0500b06853c951d0f235c27b6a5e9218ad772943379.zip)" = 721878937
          printf '%s  %s\n' d68a78499962b9739ad9916184b07affe3f3c4ebb93c2feb53911034da7a6f92 TikTeam.Setup.exe 5312e0cc64d01f3b209ea43a10189045c706c26958ce4e73fbad2e4186af3459 release.json 1e114e8dfde7e6f6fc1de0500b06853c951d0f235c27b6a5e9218ad772943379 client-1e114e8dfde7e6f6fc1de0500b06853c951d0f235c27b6a5e9218ad772943379.zip | sha256sum --check --strict
          cd ..
          if jq -e '.isDraft' release-state.json > /dev/null; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
          fi
