name: Independently verify TikTeam 1.2.51 for Windows

on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-client-1.2.51.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikteam-defender-client-1.2.51
  cancel-in-progress: false

jobs:
  defender:
    if: github.repository == 'etologin/Tikteam-site' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Verify package and installer pins and scan without executing them
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $expected = '3111B2F560232FB4B07FED4D7FBFF8AD961528F6EC0C747738C13DCA48F8D744'
          $setupHash = '18FD8351E3B4DF0314FFF28DCC3F9FDBA90115A21CBFA79664757B27D94B9E0D'
          $status = Get-MpComputerStatus
          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) { throw 'Defender is unavailable' }
          Update-MpSignature
          $status = Get-MpComputerStatus
          $file = Join-Path $env:RUNNER_TEMP 'TikTeam-client-1.2.51.zip'
          Invoke-WebRequest -UseBasicParsing -MaximumRedirection 0 -Uri 'https://updates.tikteam.live/packages/3111b2f560232fb4b07fed4d7fbff8ad961528f6ec0c747738c13dca48f8d744.zip' -OutFile $file
          if ((Get-Item -LiteralPath $file).Length -ne 991053917 -or (Get-FileHash -LiteralPath $file).Hash -ne $expected) { throw 'Client pin mismatch' }
          $folder = Join-Path $env:RUNNER_TEMP 'TikTeam-client-1.2.51'
          Expand-Archive -LiteralPath $file -DestinationPath $folder
          $installer = Join-Path $folder 'TikTeam.Setup.exe'
          $count = (Get-ChildItem -LiteralPath $folder -File -Recurse).Count
          if ($count -ne 3455) { throw 'Extracted inventory mismatch' }
          if ((Get-Item -LiteralPath $installer).Length -ne 117371881 -or (Get-FileHash -LiteralPath $installer).Hash -ne $setupHash) { throw 'Installer pin mismatch' }
          $scanner = 'C:\ProgramData\Microsoft\Windows Defender\Platform\CurrentVersion\MpCmdRun.exe'
          if (-not (Test-Path -LiteralPath $scanner)) { $scanner = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe' }
          $output = & $scanner -Scan -ScanType 3 -File $folder -DisableRemediation 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $output
          if ($code -ne 0 -or $output -notmatch 'found no threats') { throw 'Defender did not return a clean scan' }
          if ((Get-FileHash -LiteralPath $file).Hash -ne $expected -or (Get-FileHash -LiteralPath $installer).Hash -ne $setupHash) { throw 'A pin changed during the scan' }
          $result = [ordered]@{Passed=$true;Sha256=$expected;SetupSha256=$setupHash;Bytes=991053917;ExtractedFiles=$count;SignatureVersion=$status.AntivirusSignatureVersion;CandidateExecuted=$false;ProtectionSettingsChanged=$false}
          $proof = $result | ConvertTo-Json -Compress
          Write-Output ('TIKTEAM_DEFENDER_RESULT=' + $proof)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ('Defender verified the pinned TikTeam package and installer. ' + $proof)
