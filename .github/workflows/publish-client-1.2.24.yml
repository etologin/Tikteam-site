name: Publish verified TikTeam 1.2.24 Windows release

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-client-1.2.24.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikteam-client-release-1.2.24
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'etologin/Tikteam-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: etologin/Tikteam-site
      RELEASE_TAG: client-v1.2.24
    steps:
      - name: Require successful independent Defender scan for the pinned client
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/etologin/Tikteam-site/actions/runs/42065767231 > defender-run.json
          jq -e '.conclusion == "success" and .head_sha == "45eb82acc2342c68594c5cf20af9858b43adf6a4" and .path == ".github/workflows/verify-client-1.2.24.yml"' defender-run.json > /dev/null

      - name: Download and verify exact published installer, signed metadata and client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 300 --retry 2 --output TikTeam.Setup.exe https://updates.tikteam.live/TikTeam.Setup.exe
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 30 --retry 2 --output release.json https://updates.tikteam.live/v1/subscriber/windows-x64/latest
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 600 --retry 2 --output client-4e429cd18eecb54243560729a94dd06486381ff10cb97efc70305eac67751648.zip https://updates.tikteam.live/packages/4e429cd18eecb54243560729a94dd06486381ff10cb97efc70305eac67751648.zip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162858849
          test "$(stat -c %s client-4e429cd18eecb54243560729a94dd06486381ff10cb97efc70305eac67751648.zip)" = 866985471
          printf '%s  %s\n' 366932b4468241a6dc0aa622aea5c823af17c6cdc55a1397319a4a57df2e0e78 TikTeam.Setup.exe 95302d72b660b171a1066b4986e392028d201b30a933c493a32ba7e0e567d2cb release.json 4e429cd18eecb54243560729a94dd06486381ff10cb97efc70305eac67751648 client-4e429cd18eecb54243560729a94dd06486381ff10cb97efc70305eac67751648.zip | sha256sum --check --strict

      - name: Publish release assets and verify mirror roundtrip
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          TikTeam 1.2.24 for Windows 10/11 (64-bit).

          New source gallery with search, categories and previews.
          Drag layers in the scene list and lock them against accidental deletion.
          Hidden layers stop playback. Widgets can show examples before going live.
          TikDonate adds a scene color picker, test previews, currency settings,
          and CSV export for donation history. Existing settings carry forward.
          TikTok connection controls reset when the stream ends.
          Choose installation folder, optional Desktop and Start menu
          shortcuts, Windows Installed Apps registration and normal uninstall.
          Installation, update, relocation and removal preserve settings by default.
          Visible download progress and verified fast mirror with origin fallback.

          The exact client passed local and independent Windows Defender custom scans.
          The installer is byte-identical to the previously verified 1.2.18 installer.
          Installer: 162858849 bytes.
          SHA256: 366932b4468241a6dc0aa622aea5c823af17c6cdc55a1397319a4a57df2e0e78
          Client archive SHA256: 4e429cd18eecb54243560729a94dd06486381ff10cb97efc70305eac67751648
          Client source: f16a3ee8bd8a1095b1fd801f09fadde831520a2c
          NOTES
          if ! gh release view "$RELEASE_TAG" --json tagName > /dev/null; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --latest=false --title 'TikTeam 1.2.24 — Windows' --notes-file release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json assets,isDraft > release-state.json
          for asset in TikTeam.Setup.exe release.json client-4e429cd18eecb54243560729a94dd06486381ff10cb97efc70305eac67751648.zip; do
            if ! jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' release-state.json > /dev/null; then
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          mkdir verified-roundtrip
          gh release download "$RELEASE_TAG" --dir verified-roundtrip
          cd verified-roundtrip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162858849
          test "$(stat -c %s client-4e429cd18eecb54243560729a94dd06486381ff10cb97efc70305eac67751648.zip)" = 866985471
          printf '%s  %s\n' 366932b4468241a6dc0aa622aea5c823af17c6cdc55a1397319a4a57df2e0e78 TikTeam.Setup.exe 95302d72b660b171a1066b4986e392028d201b30a933c493a32ba7e0e567d2cb release.json 4e429cd18eecb54243560729a94dd06486381ff10cb97efc70305eac67751648 client-4e429cd18eecb54243560729a94dd06486381ff10cb97efc70305eac67751648.zip | sha256sum --check --strict
          cd ..
          if jq -e '.isDraft' release-state.json > /dev/null; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
          fi
