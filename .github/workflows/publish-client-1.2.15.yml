name: Publish verified TikTeam 1.2.15 Windows release

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-client-1.2.15.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikteam-client-release-1.2.15
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'etologin/Tikteam-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: etologin/Tikteam-site
      RELEASE_TAG: client-v1.2.15
    steps:
      - name: Require successful independent Defender scan for the pinned installer
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/etologin/Tikteam-site/actions/runs/41816136727 > defender-run.json
          jq -e '.conclusion == "success" and .head_sha == "b537cf1bb76e9c283881c2c0da4946327c121fa0" and .path == ".github/workflows/verify-installer-1.2.15.yml"' defender-run.json > /dev/null

      - name: Download and verify exact published installer, signed metadata and client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 300 --retry 2 --output TikTeam.Setup.exe https://updates.tikteam.live/TikTeam.Setup.exe
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 30 --retry 2 --output release.json https://updates.tikteam.live/v1/subscriber/windows-x64/latest
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 600 --retry 2 --output client-9b38a49b5e89e095c9556f18ac9e70a2b72a6f70326091ef983d26b7e344ed68.zip https://updates.tikteam.live/packages/9b38a49b5e89e095c9556f18ac9e70a2b72a6f70326091ef983d26b7e344ed68.zip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162821985
          test "$(stat -c %s client-9b38a49b5e89e095c9556f18ac9e70a2b72a6f70326091ef983d26b7e344ed68.zip)" = 827866089
          printf '%s  %s\n' b499110c7060766b5cba2dbd62f165e3cc3ed945fc20e5b526ae29ad61c7be1b TikTeam.Setup.exe 9075965a53376cbd54366efd119268f346f5cb719aed211e14274863b48a5afd release.json 9b38a49b5e89e095c9556f18ac9e70a2b72a6f70326091ef983d26b7e344ed68 client-9b38a49b5e89e095c9556f18ac9e70a2b72a6f70326091ef983d26b7e344ed68.zip | sha256sum --check --strict

      - name: Publish release assets and verify mirror roundtrip
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          TikTeam 1.2.15 for Windows 10/11 (64-bit).

          New installer: choose installation folder, optional Desktop and Start menu
          shortcuts, Windows Installed Apps registration and normal uninstall.
          Installation, update, relocation and removal preserve settings by default.
          Visible download progress and verified fast mirror with origin fallback.

          The exact installer passed local and independent Windows Defender custom scans.
          Installer: 162821985 bytes.
          SHA256: b499110c7060766b5cba2dbd62f165e3cc3ed945fc20e5b526ae29ad61c7be1b
          Client archive SHA256: 9b38a49b5e89e095c9556f18ac9e70a2b72a6f70326091ef983d26b7e344ed68
          Client source: 9bd1e05f229f28b423064603ddc606a0b076374e
          NOTES
          if ! gh release view "$RELEASE_TAG" --json tagName > /dev/null; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --latest=false --title 'TikTeam 1.2.15 — Windows' --notes-file release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json assets,isDraft > release-state.json
          for asset in TikTeam.Setup.exe release.json client-9b38a49b5e89e095c9556f18ac9e70a2b72a6f70326091ef983d26b7e344ed68.zip; do
            if ! jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' release-state.json > /dev/null; then
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          mkdir verified-roundtrip
          gh release download "$RELEASE_TAG" --dir verified-roundtrip
          cd verified-roundtrip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162821985
          test "$(stat -c %s client-9b38a49b5e89e095c9556f18ac9e70a2b72a6f70326091ef983d26b7e344ed68.zip)" = 827866089
          printf '%s  %s\n' b499110c7060766b5cba2dbd62f165e3cc3ed945fc20e5b526ae29ad61c7be1b TikTeam.Setup.exe 9075965a53376cbd54366efd119268f346f5cb719aed211e14274863b48a5afd release.json 9b38a49b5e89e095c9556f18ac9e70a2b72a6f70326091ef983d26b7e344ed68 client-9b38a49b5e89e095c9556f18ac9e70a2b72a6f70326091ef983d26b7e344ed68.zip | sha256sum --check --strict
          cd ..
          if jq -e '.isDraft' release-state.json > /dev/null; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
          fi
