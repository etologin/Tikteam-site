name: Publish verified TikTeam 1.2.33 Windows release

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-client-1.2.33.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikteam-client-release-1.2.33
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'etologin/Tikteam-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: etologin/Tikteam-site
      RELEASE_TAG: client-v1.2.33
    steps:
      - name: Require successful independent Defender scan for the pinned client
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/etologin/Tikteam-site/actions/runs/42533527155 > defender-run.json
          jq -e '.conclusion == "success" and .head_sha == "f01901d589be5f8e88586729cc15d9afd888efbe" and .path == ".github/workflows/verify-client-1.2.33.yml"' defender-run.json > /dev/null

      - name: Download and verify exact published installer, signed metadata and client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 300 --retry 2 --output TikTeam.Setup.exe https://updates.tikteam.live/TikTeam.Setup.exe
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 30 --retry 2 --output release.json https://updates.tikteam.live/v1/subscriber/windows-x64/latest
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 600 --retry 2 --output client-4c8d13b870ec2b4bf42aa73621f86dc0af1b680986fb6ff35b945c18b83c23e4.zip https://updates.tikteam.live/packages/4c8d13b870ec2b4bf42aa73621f86dc0af1b680986fb6ff35b945c18b83c23e4.zip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162877281
          test "$(stat -c %s client-4c8d13b870ec2b4bf42aa73621f86dc0af1b680986fb6ff35b945c18b83c23e4.zip)" = 721881935
          printf '%s  %s\n' cc754f0d2e2ebe563d361d06b2c1616996bdeaf62c266f3f21f7b799ac1e2140 TikTeam.Setup.exe 5086ae0a13f407138766f03bbfeb9050eff121ec12097a1362fb209c92a2b8c4 release.json 4c8d13b870ec2b4bf42aa73621f86dc0af1b680986fb6ff35b945c18b83c23e4 client-4c8d13b870ec2b4bf42aa73621f86dc0af1b680986fb6ff35b945c18b83c23e4.zip | sha256sum --check --strict

      - name: Publish release assets and verify mirror roundtrip
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          TikTeam 1.2.33 for Windows 10/11 (64-bit).

          Приветствие показывает входы зрителей, пришедшие во время открытия сцены.
          Проверено получение входа зрителя и подарка на открытом эфире TikTok.
          Исправлено выравнивание рейтингов справа, упрощены настройки эффектов.
          Повторный запуск показывает окно TikTeam с понятным предупреждением.

          Installer: 162877281 bytes.
          SHA256: cc754f0d2e2ebe563d361d06b2c1616996bdeaf62c266f3f21f7b799ac1e2140
          Client archive SHA256: 4c8d13b870ec2b4bf42aa73621f86dc0af1b680986fb6ff35b945c18b83c23e4
          Client source: ec22849a8c40f4365a0c8add02c4107ec27c67a0
          NOTES
          if ! gh release view "$RELEASE_TAG" --json tagName > /dev/null; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --latest=false --title 'TikTeam 1.2.33 — Windows' --notes-file release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json assets,isDraft > release-state.json
          for asset in TikTeam.Setup.exe release.json client-4c8d13b870ec2b4bf42aa73621f86dc0af1b680986fb6ff35b945c18b83c23e4.zip; do
            if ! jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' release-state.json > /dev/null; then
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          mkdir verified-roundtrip
          gh release download "$RELEASE_TAG" --dir verified-roundtrip
          cd verified-roundtrip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162877281
          test "$(stat -c %s client-4c8d13b870ec2b4bf42aa73621f86dc0af1b680986fb6ff35b945c18b83c23e4.zip)" = 721881935
          printf '%s  %s\n' cc754f0d2e2ebe563d361d06b2c1616996bdeaf62c266f3f21f7b799ac1e2140 TikTeam.Setup.exe 5086ae0a13f407138766f03bbfeb9050eff121ec12097a1362fb209c92a2b8c4 release.json 4c8d13b870ec2b4bf42aa73621f86dc0af1b680986fb6ff35b945c18b83c23e4 client-4c8d13b870ec2b4bf42aa73621f86dc0af1b680986fb6ff35b945c18b83c23e4.zip | sha256sum --check --strict
          cd ..
          if jq -e '.isDraft' release-state.json > /dev/null; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
          fi
