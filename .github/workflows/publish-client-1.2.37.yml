name: Publish verified TikTeam 1.2.37 Windows release

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-client-1.2.37.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikteam-client-release-1.2.37
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'etologin/Tikteam-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: etologin/Tikteam-site
      RELEASE_TAG: client-v1.2.37
    steps:
      - name: Require successful independent Defender scan for the pinned client
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/etologin/Tikteam-site/actions/runs/43242851135 > defender-run.json
          jq -e '.conclusion == "success" and .head_sha == "85c9a48fe324e10ec254ca8d783f36c8187bdc49" and .path == ".github/workflows/verify-client-1.2.37.yml"' defender-run.json > /dev/null

      - name: Download and verify exact published installer, signed metadata and client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 300 --retry 2 --output TikTeam.Setup.exe https://updates.tikteam.live/TikTeam.Setup.exe
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 30 --retry 2 --output release.json https://updates.tikteam.live/v1/subscriber/windows-x64/latest
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 600 --retry 2 --output client-f49f56b48d9ec214b15bd9211007fbe97080f163872841584bea93059e05945c.zip https://updates.tikteam.live/packages/f49f56b48d9ec214b15bd9211007fbe97080f163872841584bea93059e05945c.zip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162877793
          test "$(stat -c %s client-f49f56b48d9ec214b15bd9211007fbe97080f163872841584bea93059e05945c.zip)" = 732211293
          printf '%s  %s\n' d8244f7dc5e6789664c3b5941bfffb6d698bfc2bdd72e4f79e9163ac8a6c70d0 TikTeam.Setup.exe c56a42909f402b03f8c1c51634873cfac23906b250a65a253715fd1f28ff6dbf release.json f49f56b48d9ec214b15bd9211007fbe97080f163872841584bea93059e05945c client-f49f56b48d9ec214b15bd9211007fbe97080f163872841584bea93059e05945c.zip | sha256sum --check --strict

      - name: Publish release assets and verify mirror roundtrip
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          TikTeam 1.2.37 for Windows 10/11 (64-bit).

          Таймер и рулетка в «Интерактиве», выбор действий и шансов для секторов.
          Снижена нагрузка виджетов. «Топ подарка» использует точный ID подарка.
          Для обновления с 1.2.36 доступен пакет изменений 12.8 МБ.

          Installer: 162877793 bytes.
          SHA256: d8244f7dc5e6789664c3b5941bfffb6d698bfc2bdd72e4f79e9163ac8a6c70d0
          Client archive SHA256: f49f56b48d9ec214b15bd9211007fbe97080f163872841584bea93059e05945c
          Client source: 0fb8e50b97ed87ee22fbc686a31880a2821a7d19
          NOTES
          if ! gh release view "$RELEASE_TAG" --json tagName > /dev/null; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --latest=false --title 'TikTeam 1.2.37 — Windows' --notes-file release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json assets,isDraft > release-state.json
          for asset in TikTeam.Setup.exe release.json client-f49f56b48d9ec214b15bd9211007fbe97080f163872841584bea93059e05945c.zip; do
            if ! jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' release-state.json > /dev/null; then
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          mkdir verified-roundtrip
          gh release download "$RELEASE_TAG" --dir verified-roundtrip
          cd verified-roundtrip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162877793
          test "$(stat -c %s client-f49f56b48d9ec214b15bd9211007fbe97080f163872841584bea93059e05945c.zip)" = 732211293
          printf '%s  %s\n' d8244f7dc5e6789664c3b5941bfffb6d698bfc2bdd72e4f79e9163ac8a6c70d0 TikTeam.Setup.exe c56a42909f402b03f8c1c51634873cfac23906b250a65a253715fd1f28ff6dbf release.json f49f56b48d9ec214b15bd9211007fbe97080f163872841584bea93059e05945c client-f49f56b48d9ec214b15bd9211007fbe97080f163872841584bea93059e05945c.zip | sha256sum --check --strict
          cd ..
          if jq -e '.isDraft' release-state.json > /dev/null; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
          fi
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
