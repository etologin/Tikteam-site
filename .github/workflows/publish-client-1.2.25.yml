name: Publish verified TikTeam 1.2.25 Windows release

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-client-1.2.25.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikteam-client-release-1.2.25
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'etologin/Tikteam-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: etologin/Tikteam-site
      RELEASE_TAG: client-v1.2.25
    steps:
      - name: Require successful independent Defender scan for the pinned client
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/etologin/Tikteam-site/actions/runs/42214015147 > defender-run.json
          jq -e '.conclusion == "success" and .head_sha == "95939d0b149b39bd2c1a04ac2abdba8bd69ed879" and .path == ".github/workflows/verify-client-1.2.25.yml"' defender-run.json > /dev/null

      - name: Download and verify exact published installer, signed metadata and client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 300 --retry 2 --output TikTeam.Setup.exe https://updates.tikteam.live/TikTeam.Setup.exe
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 30 --retry 2 --output release.json https://updates.tikteam.live/v1/subscriber/windows-x64/latest
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 600 --retry 2 --output client-f0f743da33fc35e99e4f20d58b0249b3e11c0530736d30ea9d089f5f5133c7ed.zip https://updates.tikteam.live/packages/f0f743da33fc35e99e4f20d58b0249b3e11c0530736d30ea9d089f5f5133c7ed.zip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162862945
          test "$(stat -c %s client-f0f743da33fc35e99e4f20d58b0249b3e11c0530736d30ea9d089f5f5133c7ed.zip)" = 867007815
          printf '%s  %s\n' f9b56092a3fd0406257b38ac2fd0845981a3214c811332a9aa69e1a76bb9d66f TikTeam.Setup.exe 4584ccab4ad7d5a2459ef47e219e4ee60ecf0eca9efe07a0ab23e4785163eb87 release.json f0f743da33fc35e99e4f20d58b0249b3e11c0530736d30ea9d089f5f5133c7ed client-f0f743da33fc35e99e4f20d58b0249b3e11c0530736d30ea9d089f5f5133c7ed.zip | sha256sum --check --strict

      - name: Publish release assets and verify mirror roundtrip
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          TikTeam 1.2.25 for Windows 10/11 (64-bit).

          Исправлен запуск TikTeam после закрытия. Журнал сохраняется в профиле пользователя.
          Новый установщик восстанавливает повреждённые файлы с сохранением настроек.
          Включены исправления редактора сцены, предпросмотра виджетов, Top Gift и TikDonate.
          Снижена нагрузка вывода оверлеев и фоновой работы клиента.

          Проверено обновление с 1.2.24 и два обычных запуска после установки.
          Пакет и установщик проверены локальным и независимым Windows Defender.
          Installer: 162862945 bytes.
          SHA256: f9b56092a3fd0406257b38ac2fd0845981a3214c811332a9aa69e1a76bb9d66f
          Client archive SHA256: f0f743da33fc35e99e4f20d58b0249b3e11c0530736d30ea9d089f5f5133c7ed
          Client source: 0280b5ccb4776ae9b81f336f0b5753226e59cf98
          NOTES
          if ! gh release view "$RELEASE_TAG" --json tagName > /dev/null; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --latest=false --title 'TikTeam 1.2.25 — Windows' --notes-file release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json assets,isDraft > release-state.json
          for asset in TikTeam.Setup.exe release.json client-f0f743da33fc35e99e4f20d58b0249b3e11c0530736d30ea9d089f5f5133c7ed.zip; do
            if ! jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' release-state.json > /dev/null; then
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          mkdir verified-roundtrip
          gh release download "$RELEASE_TAG" --dir verified-roundtrip
          cd verified-roundtrip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162862945
          test "$(stat -c %s client-f0f743da33fc35e99e4f20d58b0249b3e11c0530736d30ea9d089f5f5133c7ed.zip)" = 867007815
          printf '%s  %s\n' f9b56092a3fd0406257b38ac2fd0845981a3214c811332a9aa69e1a76bb9d66f TikTeam.Setup.exe 4584ccab4ad7d5a2459ef47e219e4ee60ecf0eca9efe07a0ab23e4785163eb87 release.json f0f743da33fc35e99e4f20d58b0249b3e11c0530736d30ea9d089f5f5133c7ed client-f0f743da33fc35e99e4f20d58b0249b3e11c0530736d30ea9d089f5f5133c7ed.zip | sha256sum --check --strict
          cd ..
          if jq -e '.isDraft' release-state.json > /dev/null; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
          fi
