name: Publish verified TikTeam 1.2.14 package mirror

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-client-package-1.2.14.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikteam-client-package-mirror-1.2.14
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'etologin/Tikteam-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download the existing signed client archive and verify its release pin
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 600 --retry 2 \
            --output client-7f098671e77a76bf93979ca983a346d0df481a778a5fdb8501363774afffb78a.zip https://updates.tikteam.live/packages/7f098671e77a76bf93979ca983a346d0df481a778a5fdb8501363774afffb78a.zip
          test "$(stat -c %s client-7f098671e77a76bf93979ca983a346d0df481a778a5fdb8501363774afffb78a.zip)" = 827833433
          printf '%s  %s\n' \
            7f098671e77a76bf93979ca983a346d0df481a778a5fdb8501363774afffb78a \
            client-7f098671e77a76bf93979ca983a346d0df481a778a5fdb8501363774afffb78a.zip | sha256sum --check --strict

      - name: Publish the verified binary without replacing an existing asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: etologin/Tikteam-site
          RELEASE_TAG: client-v1.2.14
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          TikTeam 1.2.14 for Windows. Mirror of the existing signed public client package.

          Size: 827833433 bytes.
          SHA256: 7f098671e77a76bf93979ca983a346d0df481a778a5fdb8501363774afffb78a

          Original: https://updates.tikteam.live/packages/7f098671e77a76bf93979ca983a346d0df481a778a5fdb8501363774afffb78a.zip
          Website: https://tikteam.live/
          NOTES
          if ! gh release view "$RELEASE_TAG" --json tagName > /dev/null; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --latest=false \
              --title 'TikTeam 1.2.14 — Windows' --notes-file release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json assets,isDraft > release.json
          if ! jq -e 'any(.assets[]; .name == "client-7f098671e77a76bf93979ca983a346d0df481a778a5fdb8501363774afffb78a.zip")' release.json > /dev/null; then
            gh release upload "$RELEASE_TAG" client-7f098671e77a76bf93979ca983a346d0df481a778a5fdb8501363774afffb78a.zip
          fi
          mkdir verified-roundtrip
          gh release download "$RELEASE_TAG" --pattern client-7f098671e77a76bf93979ca983a346d0df481a778a5fdb8501363774afffb78a.zip --dir verified-roundtrip
          test "$(stat -c %s verified-roundtrip/client-7f098671e77a76bf93979ca983a346d0df481a778a5fdb8501363774afffb78a.zip)" = 827833433
          printf '%s  %s\n' \
            7f098671e77a76bf93979ca983a346d0df481a778a5fdb8501363774afffb78a \
            verified-roundtrip/client-7f098671e77a76bf93979ca983a346d0df481a778a5fdb8501363774afffb78a.zip | sha256sum --check --strict
          if jq -e '.isDraft' release.json > /dev/null; then
            gh release edit "$RELEASE_TAG" --draft=false --latest=false
          fi

