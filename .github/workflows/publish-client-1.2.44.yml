name: Publish verified TikTeam 1.2.44 Windows release

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-client-1.2.44.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikteam-client-release-1.2.44
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'etologin/Tikteam-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: etologin/Tikteam-site
      RELEASE_TAG: client-v1.2.44
    steps:
      - name: Require successful independent Defender scan for the pinned client
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/etologin/Tikteam-site/actions/runs/44517116024 > defender-run.json
          jq -e '.conclusion == "success" and .head_sha == "6f0934496b600835205e57c033f03610c63a545c" and .path == ".github/workflows/verify-client-1.2.44.yml"' defender-run.json > /dev/null

      - name: Download and verify exact published installer, signed metadata and client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 300 --retry 2 --output TikTeam.Setup.exe https://updates.tikteam.live/TikTeam.Setup.exe
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 30 --retry 2 --output release.json https://updates.tikteam.live/v1/subscriber/windows-x64/latest
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 600 --retry 2 --output client-8d095f352e2f9555699570c0cfe35def1a4a25869b4e220eacf783cc73536cc0.zip https://updates.tikteam.live/packages/8d095f352e2f9555699570c0cfe35def1a4a25869b4e220eacf783cc73536cc0.zip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162887468
          test "$(stat -c %s client-8d095f352e2f9555699570c0cfe35def1a4a25869b4e220eacf783cc73536cc0.zip)" = 728001208
          printf '%s  %s\n' 568e6efbf1f70ab64bf8efbd51f73a4d913d7574ce35a1ce5db9e11dec34b018 TikTeam.Setup.exe 7abf5fd40c19a8695aa6f0d00ae333e82eae6e8f57f5210086a2489c76c3afb0 release.json 8d095f352e2f9555699570c0cfe35def1a4a25869b4e220eacf783cc73536cc0 client-8d095f352e2f9555699570c0cfe35def1a4a25869b4e220eacf783cc73536cc0.zip | sha256sum --check --strict

      - name: Publish release assets and verify mirror roundtrip
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          TikTeam 1.2.44 for Windows 10/11 (64-bit).

          Ускорен запуск TikTeam. После обновления старые файлы программы удаляются автоматически. Сохраняются рабочая версия, версия для отката и данные стримера. Обновлены Avatar Overlay и Battle Overlay.
          При обновлении с 1.2.43 скачиваются 13 изменённых файлов (79.7 МБ).
          Android 0.3.10: https://updates.tikteam.live/android/TikTeam-Android-0.3.10.apk

          Installer: 162887468 bytes.
          SHA256: 568e6efbf1f70ab64bf8efbd51f73a4d913d7574ce35a1ce5db9e11dec34b018
          Client archive SHA256: 8d095f352e2f9555699570c0cfe35def1a4a25869b4e220eacf783cc73536cc0
          Client source: fdaeb7d6b541028cd7e84fd841932854f31c982b
          NOTES
          if ! gh release view "$RELEASE_TAG" --json tagName > /dev/null; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --latest=false --title 'TikTeam 1.2.44 — Windows' --notes-file release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json assets,isDraft > release-state.json
          for asset in TikTeam.Setup.exe release.json client-8d095f352e2f9555699570c0cfe35def1a4a25869b4e220eacf783cc73536cc0.zip; do
            if ! jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' release-state.json > /dev/null; then
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          mkdir verified-roundtrip
          gh release download "$RELEASE_TAG" --dir verified-roundtrip
          cd verified-roundtrip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162887468
          test "$(stat -c %s client-8d095f352e2f9555699570c0cfe35def1a4a25869b4e220eacf783cc73536cc0.zip)" = 728001208
          printf '%s  %s\n' 568e6efbf1f70ab64bf8efbd51f73a4d913d7574ce35a1ce5db9e11dec34b018 TikTeam.Setup.exe 7abf5fd40c19a8695aa6f0d00ae333e82eae6e8f57f5210086a2489c76c3afb0 release.json 8d095f352e2f9555699570c0cfe35def1a4a25869b4e220eacf783cc73536cc0 client-8d095f352e2f9555699570c0cfe35def1a4a25869b4e220eacf783cc73536cc0.zip | sha256sum --check --strict
          cd ..
          if jq -e '.isDraft' release-state.json > /dev/null; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
          fi
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
