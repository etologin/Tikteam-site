name: Publish verified TikTeam 1.2.31 Windows release

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-client-1.2.31.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikteam-client-release-1.2.31
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'etologin/Tikteam-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: etologin/Tikteam-site
      RELEASE_TAG: client-v1.2.31
    steps:
      - name: Require successful independent Defender scan for the pinned client
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/etologin/Tikteam-site/actions/runs/42504866918 > defender-run.json
          jq -e '.conclusion == "success" and .head_sha == "569da788111fb0f3d98b0321f0cb5b9701eb2eaa" and .path == ".github/workflows/verify-client-1.2.31.yml"' defender-run.json > /dev/null

      - name: Download and verify exact published installer, signed metadata and client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 300 --retry 2 --output TikTeam.Setup.exe https://updates.tikteam.live/TikTeam.Setup.exe
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 30 --retry 2 --output release.json https://updates.tikteam.live/v1/subscriber/windows-x64/latest
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 600 --retry 2 --output client-e0cdbc1b884afbdd4288c6ac51660159c97920040b04644d4013a0aed02becf6.zip https://updates.tikteam.live/packages/e0cdbc1b884afbdd4288c6ac51660159c97920040b04644d4013a0aed02becf6.zip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162876769
          test "$(stat -c %s client-e0cdbc1b884afbdd4288c6ac51660159c97920040b04644d4013a0aed02becf6.zip)" = 721874326
          printf '%s  %s\n' 36571014f6bd9a331cc3d6928665073545b8e0d22ef4e6e3f61a4b6f8a181871 TikTeam.Setup.exe 80a95235c7001140764d206fde99d703fcde14ac2b864b13e6d3ccffb7fb3833 release.json e0cdbc1b884afbdd4288c6ac51660159c97920040b04644d4013a0aed02becf6 client-e0cdbc1b884afbdd4288c6ac51660159c97920040b04644d4013a0aed02becf6.zip | sha256sum --check --strict

      - name: Publish release assets and verify mirror roundtrip
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          TikTeam 1.2.31 for Windows 10/11 (64-bit).

          Список сцен раскрывается по названию текущей сцены. Длинные списки прокручиваются.
          Меню «…» у сцен открывается в тёмной теме.
          При обновлении с поддерживаемых версий установщик с сайта и кнопка внутри TikTeam скачивают архив изменений.
          Проверены обновление, сохранение настроек и откат. Пакет прошёл две проверки Windows Defender.

          Installer: 162876769 bytes.
          SHA256: 36571014f6bd9a331cc3d6928665073545b8e0d22ef4e6e3f61a4b6f8a181871
          Client archive SHA256: e0cdbc1b884afbdd4288c6ac51660159c97920040b04644d4013a0aed02becf6
          Client source: 4756e10191f43553991a0fadd18904caadd35134
          NOTES
          if ! gh release view "$RELEASE_TAG" --json tagName > /dev/null; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --latest=false --title 'TikTeam 1.2.31 — Windows' --notes-file release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json assets,isDraft > release-state.json
          for asset in TikTeam.Setup.exe release.json client-e0cdbc1b884afbdd4288c6ac51660159c97920040b04644d4013a0aed02becf6.zip; do
            if ! jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' release-state.json > /dev/null; then
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          mkdir verified-roundtrip
          gh release download "$RELEASE_TAG" --dir verified-roundtrip
          cd verified-roundtrip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162876769
          test "$(stat -c %s client-e0cdbc1b884afbdd4288c6ac51660159c97920040b04644d4013a0aed02becf6.zip)" = 721874326
          printf '%s  %s\n' 36571014f6bd9a331cc3d6928665073545b8e0d22ef4e6e3f61a4b6f8a181871 TikTeam.Setup.exe 80a95235c7001140764d206fde99d703fcde14ac2b864b13e6d3ccffb7fb3833 release.json e0cdbc1b884afbdd4288c6ac51660159c97920040b04644d4013a0aed02becf6 client-e0cdbc1b884afbdd4288c6ac51660159c97920040b04644d4013a0aed02becf6.zip | sha256sum --check --strict
          cd ..
          if jq -e '.isDraft' release-state.json > /dev/null; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
          fi
