name: Publish verified TikTeam 1.2.43 Windows release

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-client-1.2.43.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikteam-client-release-1.2.43
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'etologin/Tikteam-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: etologin/Tikteam-site
      RELEASE_TAG: client-v1.2.43
    steps:
      - name: Require successful independent Defender scan for the pinned client
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/etologin/Tikteam-site/actions/runs/44190361619 > defender-run.json
          jq -e '.conclusion == "success" and .head_sha == "e57a03e3752b89fc6f8f7d18fbbfcce1f084c181" and .path == ".github/workflows/verify-client-1.2.43.yml"' defender-run.json > /dev/null

      - name: Download and verify exact published installer, signed metadata and client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 300 --retry 2 --output TikTeam.Setup.exe https://updates.tikteam.live/TikTeam.Setup.exe
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 30 --retry 2 --output release.json https://updates.tikteam.live/v1/subscriber/windows-x64/latest
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 600 --retry 2 --output client-a3546fc5a690ef7bc45f1e152c13bcfb7ca9214a8ae292ed6cc1faf834c52dd9.zip https://updates.tikteam.live/packages/a3546fc5a690ef7bc45f1e152c13bcfb7ca9214a8ae292ed6cc1faf834c52dd9.zip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162877793
          test "$(stat -c %s client-a3546fc5a690ef7bc45f1e152c13bcfb7ca9214a8ae292ed6cc1faf834c52dd9.zip)" = 727790605
          printf '%s  %s\n' d8244f7dc5e6789664c3b5941bfffb6d698bfc2bdd72e4f79e9163ac8a6c70d0 TikTeam.Setup.exe a9ae541aff8782335608cb478702d0ddc6ca7e33643dd05149e2d772b03b6bea release.json a3546fc5a690ef7bc45f1e152c13bcfb7ca9214a8ae292ed6cc1faf834c52dd9 client-a3546fc5a690ef7bc45f1e152c13bcfb7ca9214a8ae292ed6cc1faf834c52dd9.zip | sha256sum --check --strict

      - name: Publish release assets and verify mirror roundtrip
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          TikTeam 1.2.43 for Windows 10/11 (64-bit).

          Диагностика записывает, что задержало кадр оверлея. Обновлено воспроизведение Avatar Overlay и Battle Overlay.
          Обновление с 1.2.42 загружает 14 файлов (15.2 МБ).
          Android 0.3.10: https://updates.tikteam.live/android/TikTeam-Android-0.3.10.apk

          Installer: 162877793 bytes.
          SHA256: d8244f7dc5e6789664c3b5941bfffb6d698bfc2bdd72e4f79e9163ac8a6c70d0
          Client archive SHA256: a3546fc5a690ef7bc45f1e152c13bcfb7ca9214a8ae292ed6cc1faf834c52dd9
          Client source: 7c5e520260360a5e6277712519e334da3a8da357
          NOTES
          if ! gh release view "$RELEASE_TAG" --json tagName > /dev/null; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --latest=false --title 'TikTeam 1.2.43 — Windows' --notes-file release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json assets,isDraft > release-state.json
          for asset in TikTeam.Setup.exe release.json client-a3546fc5a690ef7bc45f1e152c13bcfb7ca9214a8ae292ed6cc1faf834c52dd9.zip; do
            if ! jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' release-state.json > /dev/null; then
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          mkdir verified-roundtrip
          gh release download "$RELEASE_TAG" --dir verified-roundtrip
          cd verified-roundtrip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162877793
          test "$(stat -c %s client-a3546fc5a690ef7bc45f1e152c13bcfb7ca9214a8ae292ed6cc1faf834c52dd9.zip)" = 727790605
          printf '%s  %s\n' d8244f7dc5e6789664c3b5941bfffb6d698bfc2bdd72e4f79e9163ac8a6c70d0 TikTeam.Setup.exe a9ae541aff8782335608cb478702d0ddc6ca7e33643dd05149e2d772b03b6bea release.json a3546fc5a690ef7bc45f1e152c13bcfb7ca9214a8ae292ed6cc1faf834c52dd9 client-a3546fc5a690ef7bc45f1e152c13bcfb7ca9214a8ae292ed6cc1faf834c52dd9.zip | sha256sum --check --strict
          cd ..
          if jq -e '.isDraft' release-state.json > /dev/null; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
          fi
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
