name: Publish verified TikTeam 1.2.35 Windows release

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-client-1.2.35.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikteam-client-release-1.2.35
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'etologin/Tikteam-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: etologin/Tikteam-site
      RELEASE_TAG: client-v1.2.35
    steps:
      - name: Require successful independent Defender scan for the pinned client
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/etologin/Tikteam-site/actions/runs/42700584501 > defender-run.json
          jq -e '.conclusion == "success" and .head_sha == "b49c8e1909f0cf5797d93865c0d49a4fc6ecebbf" and .path == ".github/workflows/verify-client-1.2.35.yml"' defender-run.json > /dev/null

      - name: Download and verify exact published installer, signed metadata and client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 300 --retry 2 --output TikTeam.Setup.exe https://updates.tikteam.live/TikTeam.Setup.exe
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 30 --retry 2 --output release.json https://updates.tikteam.live/v1/subscriber/windows-x64/latest
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 600 --retry 2 --output client-a2e2145d3798a67f95eba71920d13494824e237200d1315009a028cfb410fbed.zip https://updates.tikteam.live/packages/a2e2145d3798a67f95eba71920d13494824e237200d1315009a028cfb410fbed.zip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162877793
          test "$(stat -c %s client-a2e2145d3798a67f95eba71920d13494824e237200d1315009a028cfb410fbed.zip)" = 725387668
          printf '%s  %s\n' d8244f7dc5e6789664c3b5941bfffb6d698bfc2bdd72e4f79e9163ac8a6c70d0 TikTeam.Setup.exe 514b1638d3c9d52bf8dda0eee54dd574be9fb9cf3a217a30b6d2284f5cbc1e50 release.json a2e2145d3798a67f95eba71920d13494824e237200d1315009a028cfb410fbed client-a2e2145d3798a67f95eba71920d13494824e237200d1315009a028cfb410fbed.zip | sha256sum --check --strict

      - name: Publish release assets and verify mirror roundtrip
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          TikTeam 1.2.35 for Windows 10/11 (64-bit).

          Четыре новых виджета, поиск подарков с картинками и код приглашения под профилем.
          Пример «Банки» прозрачный и совпадает по положению с банкой в эфире.
          Смешивание прозрачных слоёв ускорено. Синхронизация сцен включена.
          С 1.2.34 загружается дельта из 67 изменённых файлов.

          Installer: 162877793 bytes.
          SHA256: d8244f7dc5e6789664c3b5941bfffb6d698bfc2bdd72e4f79e9163ac8a6c70d0
          Client archive SHA256: a2e2145d3798a67f95eba71920d13494824e237200d1315009a028cfb410fbed
          Client source: 111718019b826ccfbcf8ac93c2f67e7a0849bcb1
          NOTES
          if ! gh release view "$RELEASE_TAG" --json tagName > /dev/null; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --latest=false --title 'TikTeam 1.2.35 — Windows' --notes-file release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json assets,isDraft > release-state.json
          for asset in TikTeam.Setup.exe release.json client-a2e2145d3798a67f95eba71920d13494824e237200d1315009a028cfb410fbed.zip; do
            if ! jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' release-state.json > /dev/null; then
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          mkdir verified-roundtrip
          gh release download "$RELEASE_TAG" --dir verified-roundtrip
          cd verified-roundtrip
          test "$(stat -c %s TikTeam.Setup.exe)" = 162877793
          test "$(stat -c %s client-a2e2145d3798a67f95eba71920d13494824e237200d1315009a028cfb410fbed.zip)" = 725387668
          printf '%s  %s\n' d8244f7dc5e6789664c3b5941bfffb6d698bfc2bdd72e4f79e9163ac8a6c70d0 TikTeam.Setup.exe 514b1638d3c9d52bf8dda0eee54dd574be9fb9cf3a217a30b6d2284f5cbc1e50 release.json a2e2145d3798a67f95eba71920d13494824e237200d1315009a028cfb410fbed client-a2e2145d3798a67f95eba71920d13494824e237200d1315009a028cfb410fbed.zip | sha256sum --check --strict
          cd ..
          if jq -e '.isDraft' release-state.json > /dev/null; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
          fi
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
