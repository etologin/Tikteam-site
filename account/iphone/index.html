<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>TikDonate на iPhone · TikTeam</title>
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="stylesheet" href="/assets/css/account.css">
  <link rel="stylesheet" href="/assets/css/iphone-account.css?v=2">
  <script type="module" src="/assets/js/account/tikdonate-iphone.js?v=2"></script>
  <link rel="stylesheet" href="../../assets/css/studio-pages.css">
  <script defer src="../../assets/js/ocean.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap top__row">
      <a class="brand" href="/account/">
        <img class="brand__mark" src="/assets/img/mark.svg" width="36" height="36" alt="">
        <span class="brand__name">Tik<span class="grad">Team</span></span>
      </a>
      <a class="lang" href="/en/account/iphone/" hreflang="en">EN</a>
    </div>
  </header>
  <main class="wrap section iphone-account">
    <h1>TikDonate на iPhone</h1>
    <div class="card">
      <p id="state" role="status" aria-live="polite">Проверяем аккаунт…</p>
      <p id="sign-in" hidden><a class="btn" href="/account/">Открыть личный кабинет</a></p>
      <div id="setup" hidden>
        <button class="btn" type="button" id="make-qr">Подключить iPhone</button>
      </div>
      <div id="qr-result" hidden>
        <img id="qr-image" width="224" height="224" alt="QR-код подключения iPhone">
        <p>Отсканируйте камерой iPhone в течение пяти минут.</p>
      </div>
      <div id="key-result" hidden>
        <p>Скопируйте ключ и вставьте его при установке команды. Ключ показывается после создания.</p>
        <label for="key">Ключ для установки</label>
        <input id="key" readonly spellcheck="false" autocomplete="off">
        <button class="btn" type="button" id="copy-key">Скопировать ключ</button>
        <a class="btn btn--ghost" href="https://www.icloud.com/shortcuts/089a4fbe013540ba83929644e2ab9e03" rel="noreferrer">Открыть быструю команду</a>
      </div>
      <button class="btn btn--ghost" type="button" id="unlink" hidden>Отвязать iPhone</button>
    </div>
    <p><a href="https://tikteam.live/iphone/">Инструкция подключения</a></p>
    <section class="card" id="donation-history" aria-labelledby="history-title" hidden>
      <h2 id="history-title">История и статистика</h2>
      <button class="btn btn--ghost" type="button" id="history-open">Открыть историю</button>
      <p id="history-summary" role="status" aria-live="polite"></p>
      <ol id="history-list" class="donation-history-list"></ol>
      <div id="history-nav" hidden>
        <button type="button" class="btn btn--ghost" id="history-prev">Назад</button>
        <button type="button" class="btn btn--ghost" id="history-next">Далее</button>
        <button type="button" class="btn btn--ghost" id="history-refresh">Обновить</button>
      </div>
    </section>
  </main>
</body>
</html>
