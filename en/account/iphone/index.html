<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>TikDonate on iPhone · TikTeam</title>
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="stylesheet" href="/assets/css/account.css">
  <link rel="stylesheet" href="/assets/css/iphone-account.css?v=2">
  <script type="module" src="/assets/js/account/tikdonate-iphone.js?v=2"></script>
  <link rel="stylesheet" href="../../../assets/css/studio-pages.css">
  <script defer src="../../../assets/js/ocean.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap top__row">
      <a class="brand" href="/en/account/">
        <img class="brand__mark" src="/assets/img/mark.svg" width="36" height="36" alt="">
        <span class="brand__name">Tik<span class="grad">Team</span></span>
      </a>
      <a class="lang" href="/account/iphone/" hreflang="ru">RU</a>
    </div>
  </header>
  <main class="wrap section iphone-account">
    <h1>TikDonate on iPhone</h1>
    <div class="card">
      <p id="state" role="status" aria-live="polite">Checking your account…</p>
      <p id="sign-in" hidden><a class="btn" href="/en/account/">Open your account</a></p>
      <div id="setup" hidden>
        <button class="btn" type="button" id="make-qr">Connect iPhone</button>
      </div>
      <div id="qr-result" hidden>
        <img id="qr-image" width="224" height="224" alt="iPhone setup QR code">
        <p>Scan with your iPhone camera within five minutes.</p>
      </div>
      <div id="key-result" hidden>
        <p>Copy the key and paste it when adding the shortcut. The key is shown when you create it.</p>
        <label for="key">Setup key</label>
        <input id="key" readonly spellcheck="false" autocomplete="off">
        <button class="btn" type="button" id="copy-key">Copy key</button>
        <a class="btn btn--ghost" href="https://www.icloud.com/shortcuts/089a4fbe013540ba83929644e2ab9e03" rel="noreferrer">Open shortcut</a>
      </div>
      <button class="btn btn--ghost" type="button" id="unlink" hidden>Unlink iPhone</button>
    </div>
    <p><a href="https://tikteam.live/en/iphone/">Setup guide</a></p>
    <section class="card" id="donation-history" aria-labelledby="history-title" hidden>
      <h2 id="history-title">History and statistics</h2>
      <button class="btn btn--ghost" type="button" id="history-open">Open history</button>
      <p id="history-summary" role="status" aria-live="polite"></p>
      <ol id="history-list" class="donation-history-list"></ol>
      <div id="history-nav" hidden>
        <button type="button" class="btn btn--ghost" id="history-prev">Previous</button>
        <button type="button" class="btn btn--ghost" id="history-next">Next</button>
        <button type="button" class="btn btn--ghost" id="history-refresh">Refresh</button>
      </div>
    </section>
  </main>
</body>
</html>
